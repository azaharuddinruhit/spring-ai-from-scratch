name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The site version is VERSION (major.minor) plus this workflow's run number as the patch, e.g. 1.0.37.
      # Pull request builds are never deployed, so they keep the local "dev" label.
      - name: Stamp version
        if: github.event_name != 'pull_request'
        run: |
          BASE="$(tr -d '[:space:]' < VERSION)"
          echo "$BASE" | grep -Eq '^[0-9]+\.[0-9]+$' || { echo "VERSION must be major.minor, got '$BASE'"; exit 1; }
          echo "SITE_VERSION=$BASE.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Deploying version $BASE.${{ github.run_number }}"

      # astro check (types + MDX) followed by the static build into dist/
      - name: Type-check and build
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
