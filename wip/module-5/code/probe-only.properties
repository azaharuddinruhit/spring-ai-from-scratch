# Probe-only: stands in for settings the real projects keep in their own application.yaml.
spring.ai.openai.api-key=dummy
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.example.com
# Stand-in for the shipping server's application.yaml (one classpath holds both apps here).
spring.ai.mcp.server.name=shipping
spring.ai.mcp.server.version=1.4.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.vectorstore.type=none
spring.ai.chat.memory.repository.jdbc.initialize-schema=never
