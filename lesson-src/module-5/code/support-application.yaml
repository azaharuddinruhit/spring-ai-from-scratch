spring:
  ai:
    tools:
      limits:
        max-calls-per-tool-default: 5
        max-calls-per-tool:
          recentOrders: 2
        max-total-tool-calls: 12
    mcp:
      client:
        type: SYNC
        initialized: false     # start even when an MCP server is down
        request-timeout: 5s
        streamable-http:
          connections:
            shipping:
              url: https://shipping-mcp.internal.example.com
  security:
    oauth2:
      client:
        registration:
          shipping:            # same name as the MCP connection: its token goes only there
            provider: acme-login
            client-id: support-assistant
            client-secret: ${SHIPPING_MCP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: mcp,shipments.read
        provider:
          acme-login:
            token-uri: https://login.example.com/oauth2/token
      resourceserver:
        jwt:
          issuer-uri: https://login.example.com

support:
  mcp:
    allowed-tools: track_shipment
