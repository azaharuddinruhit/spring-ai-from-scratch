# Probe-only: the workspace classpath also holds the OpenAI starter for the probes; the lesson apps don't. A dummy key lets its
# beans start (they are never called), and the model types no lesson uses are off.
spring.ai.openai.api-key=dummy
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
